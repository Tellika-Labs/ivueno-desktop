 <path id="back" d="M93 92C93 63 123 44 149 56L278 115C302 126 317 150 317 176V355C317 379 303 400 281 410L177 457C137 475 93 446 93 402Z"/>
 <path id="front" d="M188 172C188 143 207 117 235 109L337 80C382 67 426 101 426 147V356C426 395 394 427 355 427H259C220 427 188 395 188 356Z"/>
 <path id="tail" d="M300 388C335 365 373 355 409 358C431 360 443 384 432 403L423 419C415 432 401 440 386 440H301C275 440 266 406 288 393Z"/>
 <mask id="m" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
  <use href="#back" fill="#fff"/>
  <use href="#front" fill="#000" stroke="#000" stroke-width="84" stroke-linejoin="round"/>
  <use href="#front" fill="#fff"/>
  <g fill="#000"><rect x="250" y="180" width="120" height="44" rx="22"/><rect x="250" y="262" width="80" height="44" rx="22"/></g>
  <use href="#tail" fill="#000" stroke="#000" stroke-width="64" stroke-linejoin="round"/>
