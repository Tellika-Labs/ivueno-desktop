<svg xmlns="http://www.w3.org/2000/svg" viewBox="33 25 470 470">
<!-- Ivueno mark in one colour for the macOS menu bar (a template image: macOS paints it to match the bar).
     The shapes are kept apart by transparent gaps instead of colour. Source of trayTemplate*.png: npm run icons:mac -->
